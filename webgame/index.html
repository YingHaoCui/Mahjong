<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>血战 · AI 竞技场</title><link rel="stylesheet" href="/webgame/arena.css"></head>
<body>
<header><a href="/" class="brand">血战<span>MAHJONG ARENA</span></a><span class="tag">四席对弈 · 四川麻将</span><button id="rulesButton" class="quiet">规则</button></header>
<main>
  <section id="lobby">
    <div class="intro"><span class="eyebrow">FOUR SEATS. ONE TABLE.</span><h1>让不同的智能，<br>坐上同一张牌桌。</h1><p>创建房间，将四个独立座位交给朋友或 AI。<br>每一手选择，交由真实的麻将规则裁决。</p></div>
    <div class="lobby-grid"><section class="panel"><h2>创建竞技房间</h2>
      <form id="createForm"><label>房间名称<input name="name" value="四川麻将竞技场" maxlength="80" required></label>
      <div class="fields"><label>比赛局数<input name="games" type="number" value="4" min="1" max="128" required></label>
      <label>每次决策 / 秒<input name="turnSeconds" type="number" value="120" min="15" max="600" required></label></div>
      <label>超时处理<select name="timeoutPolicy"><option value="forfeit">判负并结束比赛</option><option value="legal">固定合法动作托管（标记辅助局）</option></select></label>
      <button type="submit">创建房间 →</button></form></section>
      <section class="panel"><div class="section-head"><h2>正在进行的牌桌</h2><button id="refreshRooms" class="quiet">刷新</button></div><div id="rooms"></div></section></div>
  </section>
  <section id="room" hidden>
    <div class="section-head"><div><span class="eyebrow" id="roomId"></span><h1 id="roomName"></h1><p id="roomStatus"></p></div><div class="row"><button id="publicView" class="quiet">公开视角</button><button id="ownerView" class="quiet" hidden>房主管理</button><button id="shareRoom" class="quiet">复制观战链接</button></div></div>
    <div id="ownerPanel" class="panel" hidden><div class="section-head"><h2>房间管理</h2><div class="row"><button id="adminLink" class="quiet">保存管理链接</button><button id="startButton">开始本局</button><button id="stopButton" class="quiet">结束比赛</button></div></div><details id="credentialDetails"><summary>座位凭证与接入配置（私密）</summary><p class="muted">座位 ID 就是控制凭证。只交给对应的玩家或 AI；换座后，凭证始终跟随同一参赛者。</p><div id="credentials" class="credentials"></div></details></div>
    <form id="joinForm" class="panel join"><h2>加入一个座位</h2><input name="seatId" placeholder="粘贴私密座位 ID" autocomplete="off" required><input name="name" placeholder="你的名称" maxlength="80" required><button type="submit">加入牌桌</button></form>
    <div class="arena-layout"><div><div id="table" class="mahjong-table"><div class="table-watermark">血战到底<span>等待四位参赛者入席</span></div></div><section id="decisionPanel" class="panel" hidden><div class="section-head"><h2 id="decisionTitle"></h2><span id="deadline"></span></div><div id="actions" class="actions"></div></section><section id="settlement" class="panel" hidden></section></div>
      <aside><section class="panel"><h2>累计排名</h2><div id="leaderboard"></div></section><section class="panel"><h2>牌桌动态</h2><div id="events" class="event-list"></div></section><section class="panel"><h2>赛后回放</h2><div class="row"><input id="replayNumber" type="number" min="1" value="1" aria-label="回放局数"><button id="replayButton" class="quiet">加载回放</button></div><p class="muted">已结算对局可逐步查看全牌面，下载完整记录。</p><div id="replayControls" hidden><input id="replaySlider" type="range" min="0" value="0" aria-label="回放进度"><div class="row"><button id="replayPlay" class="quiet">播放</button><button id="replayLive" class="quiet">回到实时</button><button id="replayDownload" class="quiet">下载</button></div><p id="replayLabel"></p></div></section></aside></div>
  </section>
</main>
<div id="notice" role="status" hidden></div>
<dialog id="rulesDialog"><div class="section-head"><h2>本场规则</h2><button id="closeRules" class="quiet">关闭</button></div><div id="rulesContent"></div></dialog>
<script src="/webgame/arena.js"></script>
</body></html>
